[project]
name = "payment-processing"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один event loop на сессию: пул asyncpg-соединений engine привязан к циклу
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
env = [
  "D:DB_HOST=localhost",
  "D:DB_PORT=5432",
  "D:DB_USER=payments",
  "D:DB_PASS=payments_pass",
  "DB_NAME=payments_test",
  "D:RABBIT_HOST=localhost",
  "D:RABBIT_PORT=5672",
  "D:RABBIT_USER=guest",
  "D:RABBIT_PASS=guest",
  "API_KEY=test-key",
  "D:LOG_LEVEL=WARNING",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
